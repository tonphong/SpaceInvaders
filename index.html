<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05030f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Space Invader: Polarity - a neon twist on the arcade classic. Playable on PC, mobile and iPad.">
  <title>Space Invader: Polarity</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305030f'/%3E%3Cpath d='M16 5l4 9 8 5v3l-8-2-4 5-4-5-8 2v-3l8-5z' fill='none' stroke='%2329e7ff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ff3df2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" aria-label="Space Invader: Polarity game screen"></canvas>
    </div>
    <div id="touch" aria-hidden="true">
      <div id="pad"><span class="chev">&#9664;</span><span class="grip">DRAG</span><span class="chev">&#9654;</span></div>
      <div id="util">
        <button id="btn-pause" type="button" aria-label="Pause">&#10074;&#10074;</button>
        <button id="btn-mute" type="button" aria-label="Mute">&#9835;</button>
      </div>
      <div id="actions">
        <button id="btn-swap" type="button" aria-label="Swap polarity">SWAP</button>
        <button id="btn-fire" type="button" aria-label="Fire">FIRE</button>
      </div>
    </div>
  </div>
  <noscript>This game needs JavaScript enabled.</noscript>
  <script type="module" src="js/game.js"></script>
</body>
</html>
