<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05030f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Space Invaders: Polarity - a neon twist on the arcade classic. Playable on PC, mobile and iPad.">
  <title>Space Invaders: Polarity</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305030f'/%3E%3Cpath d='M16 5l4 9 8 5v3l-8-2-4 5-4-5-8 2v-3l8-5z' fill='none' stroke='%2329e7ff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23ff3df2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="in-menu">
  <div id="app">
    <div id="stage">
      <div id="screen">
        <canvas id="game" aria-label="Space Invaders: Polarity game screen"></canvas>
        <div id="ui">
          <section class="panel menu" data-panel="main" aria-label="Main menu">
            <button class="btn primary" type="button" data-action="continue" data-label="continue">PLAY</button>
            <button class="btn" type="button" data-action="new" data-label="new">NEW RUN · WAVE 1</button>
            <button class="btn" type="button" data-action="open" data-target="waves">WAVE SELECT</button>
            <button class="btn" type="button" data-action="open" data-target="help">HOW TO PLAY</button>
            <button class="btn" type="button" data-action="open" data-target="settings">SETTINGS</button>
          </section>

          <section class="panel card" data-panel="waves" aria-label="Wave select">
            <h2>WAVE SELECT</h2>
            <p class="sub">Replay any wave you've reached. Progress saves automatically.</p>
            <div class="scroll"><div class="wave-grid" data-fill="waves"></div></div>
            <button class="btn back" type="button" data-action="back">BACK</button>
          </section>

          <section class="panel card" data-panel="help" aria-label="How to play">
            <h2>HOW TO PLAY</h2>
            <div class="scroll" data-fill="help"></div>
            <button class="btn back" type="button" data-action="back">BACK</button>
          </section>

          <section class="panel card" data-panel="settings" aria-label="Settings">
            <h2>SETTINGS</h2>
            <div class="scroll" data-fill="settings"></div>
            <button class="btn back" type="button" data-action="back">BACK</button>
          </section>

          <section class="panel card compact" data-panel="pause" aria-label="Paused">
            <h2>PAUSED</h2>
            <button class="btn primary" type="button" data-action="resume">RESUME</button>
            <button class="btn" type="button" data-action="open" data-target="settings">SETTINGS</button>
            <button class="btn" type="button" data-action="quit">QUIT TO MENU</button>
          </section>

          <section class="panel menu over" data-panel="over" aria-label="Game over">
            <button class="btn primary" type="button" data-action="retry" data-label="retry">RETRY</button>
            <button class="btn" type="button" data-action="open" data-target="waves">WAVE SELECT</button>
            <button class="btn" type="button" data-action="quit">MAIN MENU</button>
          </section>
        </div>
      </div>
    </div>
    <div id="touch" aria-hidden="true">
      <div id="pad"><span class="chev">&#9664;</span><span class="grip">DRAG</span><span class="chev">&#9654;</span></div>
      <div id="util">
        <button id="btn-pause" type="button" aria-label="Pause">&#10074;&#10074;</button>
        <button id="btn-mute" type="button" aria-label="Mute">&#9835;</button>
      </div>
      <div id="actions">
        <button id="btn-swap" type="button" aria-label="Swap polarity">SWAP</button>
        <button id="btn-fire" type="button" aria-label="Fire">FIRE</button>
      </div>
    </div>
  </div>
  <noscript>This game needs JavaScript enabled.</noscript>
  <script type="module" src="js/game.js"></script>
</body>
</html>
